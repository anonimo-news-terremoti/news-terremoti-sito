.stato-live {
    width: fit-content;
    margin: 0 auto 25px;

    align-items: center;

    background: rgba(0,0,0,.25);

}

    height: 10px;

    background: #39e66b;

@keyframes pulsazione {

<header>

    <h1>🇮🇹 Ultimi Terremoti Italia</h1>

    <p class="sottotitolo">
        Eventi sismici registrati in Italia in tempo reale
    </p>

</header>


<main class="contenitore">

    <h2 class="titolo-sezione">
        🔴 Ultimi eventi sismici
    </h2>

    <div class="stato-live">
        <span class="pallino-live"></span>
        DATI INGV — AGGIORNAMENTO AUTOMATICO
    </div>

    <div
        id="listaTerremoti"
        class="lista-terremoti">

        <div class="caricamento">
            ⏳ Caricamento degli ultimi terremoti...
        </div>

    </div>

    <a
        class="btn-home"
        href="index.html">

        ← Torna alla Home

    </a>

</main>


<script>

const lista =
    document.getElementById(
        "listaTerremoti"
    );


function formattaData(timestamp) {

    return new Intl.DateTimeFormat(
        "it-IT",
        {
            dateStyle: "short",
            timeStyle: "medium"
        }
    ).format(
        new Date(timestamp)
    );

}


async function caricaTerremotiItalia() {

    try {

        lista.innerHTML = `
            <div class="caricamento">
                ⏳ Aggiornamento dati INGV...
            </div>
        `;


        const fine =
            new Date();


        const inizio =
            new Date(
                fine.getTime()
                -
                24 * 60 * 60 * 1000
            );


        const formatta =
            data =>
                data
                .toISOString()
                .replace(
                    /\.\d{3}Z$/,
                    ""
                );


        const url =
            "https://webservices.ingv.it/fdsnws/event/1/query" +

            "?starttime=" +
            encodeURIComponent(
                formatta(inizio)
            ) +

            "&endtime=" +
            encodeURIComponent(
                formatta(fine)
            ) +

            "&minlat=35" +
            "&maxlat=48" +

            "&minlon=6" +
            "&maxlon=19" +

            "&format=geojson" +

            "&orderby=time";


        const risposta =
            await fetch(url);


        if (!risposta.ok) {

            throw new Error(
                "INGV HTTP " +
                risposta.status
            );

        }


        const dati =
            await risposta.json();


        const eventi =
            (dati.features || [])
            .sort(
                (a,b) =>
                    (b.properties?.time || 0)
                    -
                    (a.properties?.time || 0)
            )
            .slice(0, 10);


        if (!eventi.length) {

            lista.innerHTML = `
                <div class="nessun-evento">
                    ℹ️ Nessun terremoto trovato
                    nelle ultime 24 ore.
                </div>
            `;

            return;

        }


        lista.innerHTML = "";


        eventi.forEach(
            evento => {

                const p =
                    evento.properties || {};

                const coordinate =
                    evento.geometry?.coordinates || [];


                const magnitudo =
                    p.mag !== null &&
                    p.mag !== undefined
                        ? Number(p.mag).toFixed(1)
                        : "N/D";


                const profondita =
                    coordinate[2] !== undefined
                        ? Number(
                            coordinate[2]
                          ).toFixed(1)
                          + " km"
                        : "N/D";


                const localita =
                    p.place ||
                    "Località non disponibile";


                const tempo =
                    p.time
                        ? formattaData(
                            p.time
                          )
                        : "N/D";


                const elemento =
                    document.createElement(
                        "article"
                    );


                elemento.className =
                    "terremoto";


                elemento.innerHTML = `

                    <div class="riga-principale">

                        <div class="magnitudo">
                            M ${magnitudo}
                        </div>

                        <div class="localita">
                            📍 ${localita}
                        </div>

                    </div>

                    <div class="dati">

                        <div class="dato">
                            📏 Profondità:
                            ${profondita}
                        </div>

                        <div class="dato">
                            🕒 ${tempo}
                        </div>

                    </div>

                    <div class="tempo">
                        Fonte: INGV
                    </div>

                `;


                lista.appendChild(
                    elemento
                );

            }
        );


    } catch (errore) {

        console.error(
            "Errore INGV:",
            errore
        );


        lista.innerHTML = `
            <div class="errore">
                ⚠️ I dati INGV
                momentaneamente non sono disponibili.
                <br><br>
                Riproveremo automaticamente.
            </div>
        `;

    }

}


/* Primo caricamento */

caricaTerremotiItalia();


/* Aggiornamento automatico ogni 60 secondi */

setInterval(
    caricaTerremotiItalia,
    60000
);

</script>

</body>
