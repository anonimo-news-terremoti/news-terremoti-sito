<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aggiornamenti Terremoti Italia - Anonimo News</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef5f9;
    color: #082d4c;
}

header {
    background: linear-gradient(135deg, #0b3656, #176c9d);
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.logo {
    width: min(300px, 80vw);
    max-height: 190px;
    object-fit: contain;
}

h1 {
    margin: 15px 0 8px;
}

.sottotitolo {
    margin: 0;
    opacity: .9;
}

.contenitore {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

.titolo-sezione {
    text-align: center;
    color: #082d4c;
    margin-bottom: 25px;
}

.box {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 25px;
    background: #176c9d;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.btn:hover {
    background: #0b3656;
}
</style>
</head>

<body>

<header>
    <img class="logo" src="logo-animono-news-web.png"
         alt="Anonimo News Terremoti">

    <h1>🇮🇹 Aggiornamenti Terremoti Italia</h1>

    <p class="sottotitolo">
        Aggiornamenti sugli eventi sismici registrati in Italia
    </p>
</header>

<main class="contenitore">

    <h2 class="titolo-sezione">
        🔴 Ultimi aggiornamenti sismici
    </h2>

    <div class="box">
        <p>
            Questa pagina sarà dedicata agli aggiornamenti sui terremoti
            registrati sul territorio italiano.
        </p>
    </div>

    <a class="btn" href="index.html">
        ← Torna alla Home
    </a>

</main>

</body>
</html>
