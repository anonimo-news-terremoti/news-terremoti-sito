<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Radar Visitatori - Anonimo News</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#eef6ff;
  background:
    radial-gradient(circle at top,#122847 0,#07111f 40%,#030811 100%);
  min-height:100vh;
}

.login{
  max-width:430px;
  margin:10vh auto;
  background:#0a1628;
  border:1px solid #1f4b78;
  border-radius:22px;
  padding:28px;
  box-shadow:0 20px 60px #0008;
}

.login h1{
  margin-top:0;
  color:#50d7ff;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #295277;
  background:#07111f;
  color:white;
  font-size:16px;
}

button{
  padding:12px 18px;
  border:0;
  border-radius:12px;
  background:#1689ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#login-btn{
  width:100%;
  margin-top:10px;
}

#login-msg{
  margin-top:12px;
  color:#ff7885;
}

#admin-area{
  display:none;
  padding:24px;
  max-width:1500px;
  margin:auto;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}

.top h1{
  margin:0;
  font-size:30px;
}

.live{
  color:#5aff9b;
  font-size:14px;
}

.live::before{
  content:"";
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#31ff83;
  box-shadow:0 0 12px #31ff83;
  margin-right:7px;
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(180px,1fr));
  gap:16px;
}

.card{
  background:linear-gradient(145deg,#0c1c32,#07111f);
  border:1px solid #183a5a;
  border-radius:18px;
  padding:20px;
  box-shadow:0 12px 30px #0004;
}

.card .titolo{
  color:#8ca6bd;
  font-size:13px;
  text-transform:uppercase;
}

.numero{
  margin-top:7px;
  font-size:38px;
  font-weight:900;
  color:#63dbff;
}

.grande{
  margin-top:18px;
  background:#07111fdd;
  border:1px solid #183a5a;
  border-radius:18px;
  overflow:hidden;
}

.grande h2{
  margin:0;
  padding:18px;
  border-bottom:1px solid #183a5a;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:13px 16px;
  border-bottom:1px solid #102a42;
  text-align:left;
  font-size:14px;
}

th{
  color:#62d9ff;
}

.badge{
  display:inline-block;
  background:#123459;
  border-radius:999px;
  padding:5px 9px;
}

.online-dot{
  color:#42ff91;
}

.vuoto{
  padding:30px;
  text-align:center;
  color:#7d94a8;
}

@media(max-width:850px){
  .cards{
    grid-template-columns:1fr 1fr;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  table{
    min-width:800px;
  }

  .grande{
    overflow:auto;
  }
}
</style>
</head>

<body>

<div id="login-area" class="login">

  <h1>🔐 Radar Visitatori</h1>

  <p>
    Accesso riservato
    all'amministratore.
  </p>

  <input
    id="email"
    type="email"
    placeholder="Email">

  <input
    id="password"
    type="password"
    placeholder="Password">

  <button id="login-btn">
    Accedi
  </button>

  <div id="login-msg"></div>

</div>


<main id="admin-area">

  <div class="top">

    <div>
      <h1>
        📡 Radar Visitatori Live
      </h1>

      <div class="live">
        MONITORAGGIO ATTIVO
      </div>
    </div>

    <button id="logout-btn">
      Esci
    </button>

  </div>


  <section class="cards">

    <div class="card">
      <div class="titolo">
        Online adesso
      </div>
      <div id="online" class="numero">
        0
      </div>
    </div>

    <div class="card">
      <div class="titolo">
        Visite oggi
      </div>
      <div id="oggi" class="numero">
        0
      </div>
    </div>

    <div class="card">
      <div class="titolo">
        Ultimi 7 giorni
      </div>
      <div id="settimana" class="numero">
        0
      </div>
    </div>

    <div class="card">
      <div class="titolo">
        Ultimi 30 giorni
      </div>
      <div id="mese" class="numero">
        0
      </div>
    </div>

  </section>


  <section class="grande">

    <h2>
      👥 Visitatori online
    </h2>

    <div id="tabella-online"></div>

  </section>


  <section class="grande">

    <h2>
      🕐 Ultimi accessi
    </h2>

    <div id="tabella-visite"></div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  limit,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCrW23TMFTFRWWOdogA5bDhWBdbN5V4hyo",
  authDomain: "news-terremoti.firebaseapp.com",
  projectId: "news-terremoti",
  storageBucket: "news-terremoti.firebasestorage.app",
  messagingSenderId: "944750257608",
  appId: "1:944750257608:web:f0add770fcf35724810cfd",
  measurementId: "G-WC79E3M0FW"
};


const ADMIN_UID =
  "V720CwqUJOh1DpHcoXq8bnhxo9k1";


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const $ =
  id => document.getElementById(id);


let stopOnline = null;
let stopVisite = null;


$("login-btn")
.addEventListener(
  "click",
  async () => {

    const email =
      $("email").value.trim();

    const password =
      $("password").value;

    $("login-msg").textContent = "";

    try {

      const cred =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      if (
        cred.user.uid !== ADMIN_UID
      ) {

        await signOut(auth);

        throw new Error(
          "Account non autorizzato"
        );
      }

    } catch (errore) {

      $("login-msg").textContent =
        "❌ Accesso non riuscito";
    }
  }
);


$("logout-btn")
.addEventListener(
  "click",
  () => signOut(auth)
);


function localita(v) {

  const parti = [
    v.city,
    v.region,
    v.country
  ].filter(Boolean);

  return parti.join(", ") || "N/D";
}


function ora(ms) {

  if (!ms)
    return "-";

  return new Date(ms)
    .toLocaleString(
      "it-IT"
    );
}


function tabellaOnline(lista) {

  if (!lista.length) {

    $("tabella-online")
      .innerHTML =
      '<div class="vuoto">Nessun visitatore online.</div>';

    return;
  }

  $("tabella-online")
    .innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Stato</th>
          <th>IP</th>
          <th>Località</th>
          <th>Dispositivo</th>
          <th>Browser</th>
          <th>Pagina</th>
          <th>Provenienza</th>
          <th>Ultimo segnale</th>
        </tr>
      </thead>

      <tbody>

      ${lista.map(v => `
        <tr>

          <td class="online-dot">
            ● Online
          </td>

          <td>
            <span class="badge">
              ${v.ip || "N/D"}
            </span>
          </td>

          <td>
            ${localita(v)}
          </td>

          <td>
            <span class="badge">
              ${v.device || "-"}
              / ${v.os || "-"}
            </span>
          </td>

          <td>
            ${v.browser || "-"}
          </td>

          <td>
            ${v.page || v.path || "-"}
          </td>

          <td>
            ${v.referrer || "Diretto"}
          </td>

          <td>
            ${ora(v.lastSeenMs)}
          </td>

        </tr>
      `).join("")}

      </tbody>
    </table>
  `;
}


function tabellaVisite(lista) {

  if (!lista.length) {

    $("tabella-visite")
      .innerHTML =
      '<div class="vuoto">Nessuna visita registrata.</div>';

    return;
  }


  $("tabella-visite")
    .innerHTML = `
    <table>

      <thead>
        <tr>
          <th>Ora</th>
          <th>IP</th>
          <th>Località</th>
          <th>Dispositivo</th>
          <th>Pagina</th>
          <th>Provenienza</th>
        </tr>
      </thead>

      <tbody>

      ${lista.slice(0,100).map(v => `
        <tr>

          <td>
            ${ora(v.createdAtMs)}
          </td>

          <td>
            <span class="badge">
              ${v.ip || "N/D"}
            </span>
          </td>

          <td>
            ${localita(v)}
          </td>

          <td>
            ${v.device || "-"}
            / ${v.browser || "-"}
          </td>

          <td>
            ${v.page || v.path || "-"}
          </td>

          <td>
            ${v.referrer || "Diretto"}
          </td>

        </tr>
      `).join("")}

      </tbody>

    </table>
  `;
}


function avviaDashboard() {

  const onlineDa =
    Date.now() - 90000;

  const qOnline =
    query(
      collection(
        db,
        "visitatori_online"
      ),
      where(
        "lastSeenMs",
        ">=",
        onlineDa
      )
    );


  stopOnline =
    onSnapshot(
      qOnline,
      snap => {

        const lista =
          snap.docs.map(
            d => d.data()
          );

        $("online")
          .textContent =
          lista.length;

        tabellaOnline(lista);
      }
    );


  const trentaGiorniFa =
    Date.now() -
    30 * 24 * 60 * 60 * 1000;


  const qVisite =
    query(
      collection(
        db,
        "visite"
      ),
      where(
        "createdAtMs",
        ">=",
        trentaGiorniFa
      ),
      orderBy(
        "createdAtMs",
        "desc"
      ),
      limit(1000)
    );


  stopVisite =
    onSnapshot(
      qVisite,
      snap => {

        const lista =
          snap.docs.map(
            d => d.data()
          );

        const adesso =
          Date.now();

        const oggiStart =
          new Date();

        oggiStart.setHours(
          0,0,0,0
        );

        const settimanaDa =
          adesso -
          7 * 24 * 60 * 60 * 1000;


        $("oggi")
          .textContent =
          lista.filter(
            v =>
              v.createdAtMs >=
              oggiStart.getTime()
          ).length;


        $("settimana")
          .textContent =
          lista.filter(
            v =>
              v.createdAtMs >=
              settimanaDa
          ).length;


        $("mese")
          .textContent =
          lista.length;


        tabellaVisite(lista);
      }
    );
}


onAuthStateChanged(
  auth,
  user => {

    if (stopOnline) {
      stopOnline();
      stopOnline = null;
    }

    if (stopVisite) {
      stopVisite();
      stopVisite = null;
    }


    if (
      user &&
      user.uid === ADMIN_UID
    ) {

      $("login-area")
        .style.display =
        "none";

      $("admin-area")
        .style.display =
        "block";

      avviaDashboard();

    } else {

      $("admin-area")
        .style.display =
        "none";

      $("login-area")
        .style.display =
        "block";
    }
  }
);

</script>

</body>
</html>
