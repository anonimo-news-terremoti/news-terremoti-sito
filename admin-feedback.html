<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Feedback - Anonimo News</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#020912,#04131f);color:#eaf8ff;min-height:100vh}.wrap{width:min(1000px,calc(100% - 28px));margin:auto;padding:28px 0}.panel{background:#071522;border:1px solid #123b52;border-radius:18px;padding:22px}.login-box{max-width:480px;margin:50px auto}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}h1{margin:0 0 10px}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;padding:13px;border-radius:10px;border:1px solid #1b4d68;background:#06131d;color:#fff;font-size:16px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn-login{width:100%;margin-top:18px;background:#0f95cb;color:#fff}.btn-logout{background:#263846;color:#fff}.btn-approve{background:#0fa56d;color:#fff}.btn-delete{background:#b92c3c;color:#fff}.message{margin-top:12px;min-height:20px;color:#ffd0d0;font-size:14px;word-break:break-word}#admin-area{display:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}.summary-card{background:#0a1d2c;border-radius:14px;padding:16px}.summary-card strong{display:block;font-size:26px}.reviews{display:grid;gap:14px}.review{background:#071522;border:1px solid #123b52;border-radius:14px;padding:16px}.review-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.review-name{font-size:19px;font-weight:800}.review-stars{color:#ffd24d;font-size:20px}.review-text{margin-top:10px;white-space:pre-wrap}.review-date{margin-top:8px;color:#7fa0b3;font-size:12px}.review-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:24px;color:#8aa5b3}
</style>
</head>
<body>
<div class="wrap">
  <div id="login-area" class="panel login-box">
    <h1>🔐 Admin Feedback</h1>
    <p>Accedi per approvare o eliminare le recensioni.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Password</label><input id="password" type="password" autocomplete="current-password">
    <button id="login-btn" class="btn-login">Accedi</button>
    <div id="login-msg" class="message"></div>
  </div>

  <div id="admin-area">
    <div class="topbar">
      <h1>⭐ Gestione Feedback</h1>
      <button id="logout-btn" class="btn-logout">🚪 Esci</button>
    </div>
    <div class="summary">
      <div class="summary-card">In attesa<strong id="pending-count">0</strong></div>
      <div class="summary-card">Approvate<strong id="approved-count">0</strong></div>
      <div class="summary-card">Totale<strong id="total-count">0</strong></div>
    </div>
    <div class="panel">
      <h2>Recensioni in attesa</h2>
      <div id="reviews" class="reviews"><div class="empty">Caricamento...</div></div>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,query,orderBy,onSnapshot,updateDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCrW23TMFTFRWWOdogA5bDhWBdbN5V4hyo",
  authDomain:"news-terremoti.firebaseapp.com",
  projectId:"news-terremoti",
  storageBucket:"news-terremoti.firebasestorage.app",
  messagingSenderId:"944750257608",
  appId:"1:944750257608:web:f0add770fcf35724810cfd",
  measurementId:"G-WC79E3M0FW"
};
const ADMIN_UID="V720CwqUJOh1DpHcoXq8bnhxo9k1";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
let unsubscribeReviews=null;

$("login-btn").addEventListener("click",async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password){$("login-msg").textContent="Inserisci email e password.";return;}
  $("login-btn").disabled=true;
  $("login-btn").textContent="Accesso...";
  $("login-msg").textContent="";
  try{
    const cred=await signInWithEmailAndPassword(auth,email,password);
    if(cred.user.uid!==ADMIN_UID){
      await signOut(auth);
      const e=new Error("Account valido, ma UID non autorizzato.");
      e.code="admin/uid-not-authorized";
      throw e;
    }
  }catch(error){
    console.error("Errore login Firebase:",error);
    $("login-msg").textContent="❌ "+(error.code||"Errore")+" — "+(error.message||"Accesso non riuscito");
  }finally{
    $("login-btn").disabled=false;
    $("login-btn").textContent="Accedi";
  }
});

$("logout-btn").addEventListener("click",()=>signOut(auth));

onAuthStateChanged(auth,user=>{
  if(unsubscribeReviews){unsubscribeReviews();unsubscribeReviews=null;}
  if(user&&user.uid===ADMIN_UID){
    $("login-area").style.display="none";
    $("admin-area").style.display="block";
    caricaRecensioni();
  }else{
    $("admin-area").style.display="none";
    $("login-area").style.display="block";
  }
});

function caricaRecensioni(){
  const q=query(collection(db,"recensioni"),orderBy("data","desc"));
  unsubscribeReviews=onSnapshot(q,snapshot=>{
    const tutte=[];
    snapshot.forEach(s=>tutte.push({id:s.id,...s.data()}));
    const attesa=tutte.filter(r=>r.approved!==true);
    const approvate=tutte.filter(r=>r.approved===true);
    $("pending-count").textContent=attesa.length;
    $("approved-count").textContent=approvate.length;
    $("total-count").textContent=tutte.length;
    mostraRecensioni(attesa);
  },err=>{
    console.error(err);
    $("reviews").innerHTML='<div class="empty">Errore nel caricamento delle recensioni.</div>';
  });
}

function mostraRecensioni(items){
  const box=$("reviews"); box.innerHTML="";
  if(!items.length){box.innerHTML='<div class="empty">✅ Nessuna recensione in attesa.</div>';return;}
  items.forEach(rec=>{
    const el=document.createElement("div"); el.className="review";
    const dt=rec.data&&typeof rec.data.toDate==="function"?rec.data.toDate().toLocaleString("it-IT"):"";
    el.innerHTML='<div class="review-head"><div class="review-name"></div><div class="review-stars"></div></div><div class="review-text"></div><div class="review-date"></div><div class="review-actions"></div>';
    el.querySelector(".review-name").textContent=rec.nome||"Senza nome";
    el.querySelector(".review-stars").textContent="⭐".repeat(Number(rec.stelle||0));
    el.querySelector(".review-text").textContent=rec.commento||"";
    el.querySelector(".review-date").textContent=dt;
    const actions=el.querySelector(".review-actions");
    const a=document.createElement("button"); a.className="btn-approve"; a.textContent="✅ Approva";
    a.onclick=()=>updateDoc(doc(db,"recensioni",rec.id),{approved:true});
    const d=document.createElement("button"); d.className="btn-delete"; d.textContent="🗑️ Elimina";
    d.onclick=async()=>{if(confirm("Eliminare definitivamente questa recensione?"))await deleteDoc(doc(db,"recensioni",rec.id));};
    actions.append(a,d); box.appendChild(el);
  });
}
</script>
</body>
</html>
